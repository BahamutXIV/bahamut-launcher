manifest_schema_version = 1
id = "pos"
kind = "addon"
name = "pos"
author = "Aeshur"
version = "1.0"
description = "Prints and copies your current position to the clipboard. Toggleable window with up to date position values."
homepage = "https://github.com/BahamutXIV/bahamut-launcher"
entry = "pos.lua"
api_version = "0.1"
minimum_runtime_version = "0.1.0"
supported_client_builds = ["2012.09.19.0001"]
capabilities = ["ui.draw", "chat.print", "clipboard.write"]
commands = [
    { name = "/pos", usage = "/pos", description = "Print and copy your current position." },
    { name = "/pos lock", usage = "/pos lock", description = "Toggle overlay dragging." },
]
