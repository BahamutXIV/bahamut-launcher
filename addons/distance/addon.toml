manifest_schema_version = 1
id = "distance"
kind = "addon"
name = "distance"
author = "AuroraFlare"
version = "1.0"
description = "Shows the distance to your current target in yalms."
entry = "distance.lua"
api_version = "0.1"
minimum_runtime_version = "0.1.0"
supported_client_builds = ["2012.09.19.0001"]
capabilities = ["ui.draw", "chat.print"]
commands = [
    { name = "/distance lock", usage = "/distance lock", description = "Toggle overlay dragging." },
    { name = "/distance color", usage = "/distance color #RRGGBB", description = "Set text color." },
    { name = "/distance size", usage = "/distance size 8-48", description = "Set text size." },
]
