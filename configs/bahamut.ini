; Starter settings. The active file is <state-root>/config/bahamut.ini.
; Extension selection and extension-owned settings use separate files.

[launcher]
; Close the launcher after the game starts successfully.
close_on_game_start = true
; Use the selected monitor's physical resolution in Borderless mode.
; With no selection or in other modes, use the launcher window's monitor.
native_resolution_override = false
; Existing FFXIV 1.x folder. Blank uses Windows registry detection.
game_location =
; HTTPS delivery host override. Blank uses the shipped content manifest.
content_root =
; Blank uses the platform default download cache folder.
download_cache_dir =
; Windows monitor device-interface identity for borderless mode.
; Blank uses the monitor nearest the game window.
borderless_monitor =

[game]
initialized = false
display_mode = windowed
width = 1280
height = 720

[game.graphics]
multisampling = none
general_quality = 8
background_quality = 5
shadow_detail = standard
ambient_occlusion = false
depth_of_field = false
cutscene_effects = true
hardware_mouse = true
texture_quality = standard
texture_filtering = standard

[game.audio]
enabled = true
play_in_background = false

[developer]
enable_verbose_wine_debug = false

[servers]
selected = Bahamut

[server.1]
display_name = Bahamut
host = bahamut.stegall.me
auth_port = 443
lobby_port = 54994
use_https = true

[server.2]
display_name = Bahamut Local
host = 127.0.0.1
auth_port = 8080
lobby_port = 54994
use_https = false
