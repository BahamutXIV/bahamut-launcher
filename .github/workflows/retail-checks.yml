name: Retail Checks

on:
  workflow_dispatch:
    inputs:
      validate_patches:
        description: Download and verify all 6.3 GB of private patch inputs
        required: true
        default: false
        type: boolean

jobs:
  retail-input:
    name: Validate retail patch input
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "This workflow only accepts refs/heads/main"
          exit 1

      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Read retail manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=manifests/retail-inputs.json
          jq -e '.repository and .commit and (.files | type == "array" and length == 1)' "$manifest" > /dev/null
          path=$(jq -er '.files[0].path' "$manifest")
          if [[ "$path" == /* || "$path" == *".."* ]]; then
            echo "Unsafe manifest path: $path" >&2
            exit 1
          fi
          {
            printf 'repository=%s\n' "$(jq -er '.repository' "$manifest")"
            printf 'commit=%s\n' "$(jq -er '.commit' "$manifest")"
            printf 'path=%s\n' "$path"
            printf 'size=%s\n' "$(jq -er '.files[0].size' "$manifest")"
            printf 'sha256=%s\n' "$(jq -er '.files[0].sha256' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout private retail input
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.manifest.outputs.repository }}
          ref: ${{ steps.manifest.outputs.commit }}
          token: ${{ secrets.BAHAMUT_ASSETS_TOKEN }}
          path: .retail-assets
          filter: blob:none
          sparse-checkout: ${{ steps.manifest.outputs.path }}
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Verify retail input
        env:
          RETAIL_PATH: ${{ steps.manifest.outputs.path }}
          EXPECTED_SIZE: ${{ steps.manifest.outputs.size }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          file=".retail-assets/$RETAIL_PATH"
          test -f "$file"
          test "$(stat --format='%s' "$file")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$file" | cut -d' ' -f1)" = "$EXPECTED_SHA256"

      - name: Run real-binary patch test
        env:
          BAHAMUT_TEST_GAME_EXE: ${{ github.workspace }}/.retail-assets/${{ steps.manifest.outputs.path }}
        run: cargo test -p bahamut-launcher --lib patches_land_on_the_expected_instructions_in_a_real_exe

  patch-inputs:
    name: Validate private patch inputs
    if: ${{ inputs.validate_patches }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "This workflow only accepts refs/heads/main"
          exit 1

      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate public patch manifest
        run: cargo test -p bahamut-launcher --lib public_patch_manifest_matches_runtime_manifest

      - name: Read patch manifest
        id: patch-manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=manifests/patches-1.23b.json
          jq -e '
            .schemaVersion == 1 and
            .repository == "BahamutXIV/bahamut-private-assets" and
            (.commit | test("^[0-9a-f]{40}$")) and
            .targetClientVersion == "2012.09.19.0001" and
            .archiveName == "FFXIV_1.23b_Patches.zip" and
            (.files | type == "array" and length == 52) and
            ([.files[].path] | unique | length == 52) and
            ([.files[].runtimePath] | unique | length == 52) and
            all(.files[];
              (.path | startswith("patches-1.23b/")) and
              (.path | contains("..") | not) and
              (.runtimePath | contains("..") | not) and
              (.size | type == "number" and . > 0) and
              (.crc32 | test("^[0-9A-F]{8}$")) and
              (.sha256 | test("^[0-9a-f]{64}$"))
            )
          ' "$manifest" > /dev/null
          {
            printf 'repository=%s\n' "$(jq -er '.repository' "$manifest")"
            printf 'commit=%s\n' "$(jq -er '.commit' "$manifest")"
            echo 'sparse<<EOF'
            jq -r '.files[].path' "$manifest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout private patch inputs
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.patch-manifest.outputs.repository }}
          ref: ${{ steps.patch-manifest.outputs.commit }}
          token: ${{ secrets.BAHAMUT_ASSETS_TOKEN }}
          path: .patch-assets
          filter: blob:none
          sparse-checkout: ${{ steps.patch-manifest.outputs.sparse }}
          sparse-checkout-cone-mode: false
          lfs: false
          fetch-depth: 1
          persist-credentials: true

      - name: Verify private patch bytes
        env:
          PATCH_COMMIT: ${{ steps.patch-manifest.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git -C .patch-assets lfs install --local --skip-smudge
          verified=0
          jq -r '.files[] | [.path, (.size | tostring), .sha256] | @tsv' \
            manifests/patches-1.23b.json |
          while IFS=$'\t' read -r path size sha256; do
            pointer=".patch-assets/$path"
            test -f "$pointer"
            grep -Fqx "oid sha256:$sha256" "$pointer"
            grep -Fqx "size $size" "$pointer"

            git -C .patch-assets lfs fetch \
              --include="$path" --exclude='' origin "$PATCH_COMMIT"
            object=".patch-assets/.git/lfs/objects/${sha256:0:2}/${sha256:2:2}/$sha256"
            test -f "$object"
            test "$(stat --format='%s' "$object")" = "$size"
            test "$(sha256sum "$object" | cut -d' ' -f1)" = "$sha256"
            rm -f -- "$object"

            verified=$((verified + 1))
            printf 'Verified %d/52 %s\n' "$verified" "$path"
          done

      - name: Remove private checkout credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if test -d .patch-assets/.git; then
            git -C .patch-assets config --local \
              --unset-all http.https://github.com/.extraheader || true
          fi
