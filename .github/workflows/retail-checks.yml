name: Retail Checks

on:
  workflow_dispatch:

jobs:
  retail-input:
    name: Validate retail patch input
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "This workflow only accepts refs/heads/main"
          exit 1

      - name: Checkout launcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Read retail manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=manifests/retail-inputs.json
          jq -e '.repository and .commit and (.files | type == "array" and length == 1)' "$manifest" > /dev/null
          path=$(jq -er '.files[0].path' "$manifest")
          if [[ "$path" == /* || "$path" == *".."* ]]; then
            echo "Unsafe manifest path: $path" >&2
            exit 1
          fi
          {
            printf 'repository=%s\n' "$(jq -er '.repository' "$manifest")"
            printf 'commit=%s\n' "$(jq -er '.commit' "$manifest")"
            printf 'path=%s\n' "$path"
            printf 'size=%s\n' "$(jq -er '.files[0].size' "$manifest")"
            printf 'sha256=%s\n' "$(jq -er '.files[0].sha256' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout private retail input
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.manifest.outputs.repository }}
          ref: ${{ steps.manifest.outputs.commit }}
          token: ${{ secrets.BAHAMUT_ASSETS_TOKEN }}
          path: .retail-assets
          filter: blob:none
          sparse-checkout: ${{ steps.manifest.outputs.path }}
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Verify retail input
        env:
          RETAIL_PATH: ${{ steps.manifest.outputs.path }}
          EXPECTED_SIZE: ${{ steps.manifest.outputs.size }}
          EXPECTED_SHA256: ${{ steps.manifest.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          file=".retail-assets/$RETAIL_PATH"
          test -f "$file"
          test "$(stat --format='%s' "$file")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$file" | cut -d' ' -f1)" = "$EXPECTED_SHA256"

      - name: Run real-binary patch test
        env:
          BAHAMUT_TEST_GAME_EXE: ${{ github.workspace }}/.retail-assets/${{ steps.manifest.outputs.path }}
        run: cargo test -p bahamut-launcher --lib patches_land_on_the_expected_instructions_in_a_real_exe
