name: Lua format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-format:
    name: Lua format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua formatter
        run: python tools/format_lua.py install

      - name: Check Lua formatting
        run: python tools/format_lua.py check
