name: Release Binaries

# Builds the launcher archive for each platform at a vX.Y.Z tag (normally the
# tag release.yml pushes), verifies every archive against its SHA-256 sidecar,
# and attaches the six files to that tag's GitHub Release. A manual run either
# rebuilds and re-attaches an existing tag or builds the selected branch
# without publishing. macOS ships a zipped universal app bundle: Developer ID
# signed, notarized and stapled when the signing secrets are set, ad hoc signed
# otherwise. See docs/releasing.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to rebuild and re-attach. Leave empty to build the selected branch without publishing."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Reruns for one tag serialize; different tags do not block each other.
concurrency:
  group: release-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      label: ${{ steps.resolve.outputs.label }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve the build ref and asset label
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "release tags must match vMAJOR.MINOR.PATCH[-PRERELEASE]: $tag" >&2
              exit 1
            fi
            ref="refs/tags/$tag"
            label="$tag"
            publish="true"
          else
            ref="$SHA"
            label="dev-${SHA:0:7}"
            publish="false"
          fi
          {
            echo "tag=$tag"
            echo "ref=$ref"
            echo "label=$label"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Full checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  build:
    name: Build (${{ matrix.display_name }})
    needs: [resolve, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The native client module targets the Visual Studio 2022 Win32 toolchain.
          - display_name: Windows
            os: windows-2022
            target: windows-x86_64
            launcher: target/release/bahamut-launcher-shell.exe
          - display_name: Linux
            # Built on 22.04 so the binary needs at most glibc 2.35.
            os: ubuntu-22.04
            target: linux-x86_64
            launcher: target/release/bahamut-launcher-shell
          # One executable for Apple Silicon and Intel, built on the arm64 runner.
          - display_name: macOS
            os: macos-latest
            target: macos-universal
            launcher: target/universal-apple-darwin/release/bahamut-launcher-shell
    env:
      ASSET_NAME: bahamut-launcher-${{ needs.resolve.outputs.label }}-${{ matrix.target }}
      LAUNCHER_BINARY: ${{ matrix.launcher }}
      TARGET: ${{ matrix.target }}
      # build.rs stamps the runtime identity from this tag, or from git describe
      # for a branch build.
      BAHAMUT_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Record the built commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commit"
          git rev-parse HEAD > "$RUNNER_TEMP/commit/$TARGET"
          cat "$RUNNER_TEMP/commit/$TARGET"

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Add the Intel macOS target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Configure x86 client module
        if: runner.os == 'Windows'
        run: cmake -S client -B out/client-release -G "Visual Studio 17 2022" -A Win32

      - name: Build x86 client module
        if: runner.os == 'Windows'
        run: cmake --build out/client-release --config Release

      - name: Test x86 client module
        if: runner.os == 'Windows'
        run: ctest --test-dir out/client-release -C Release --output-on-failure

      - name: Install llvm-mingw (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset=llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
              # SHA-256 for the pinned mstorsjo/llvm-mingw release asset.
              sha256=bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21
              ;;
            macOS)
              asset=llvm-mingw-20260922-ucrt-macos-universal.tar.xz
              sha256=52e5f5a7b131021d0c39a37a38fa380a1da7885cd04bd61afd0cd4ecfb8bc1f3
              ;;
            *)
              echo "unsupported runner OS for llvm-mingw: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/$asset"
          echo "$sha256  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/${asset%.tar.xz}" >> "$GITHUB_ENV"

      - name: Configure x86 client module (cross)
        if: runner.os != 'Windows'
        run: |
          cmake -S client -B out/client-mingw \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/client/cmake/llvm-mingw-i686.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_MINGW_ROOT="$LLVM_MINGW_ROOT"

      - name: Build x86 client module (cross)
        if: runner.os != 'Windows'
        run: cmake --build out/client-mingw --config Release --target bahamut-loader bahamut screenshot discord-rpc

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p bahamut-launcher-shell

      - name: Build universal release binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin -p bahamut-launcher-shell
          cargo build --release --locked --target x86_64-apple-darwin -p bahamut-launcher-shell
          mkdir -p "$(dirname "$LAUNCHER_BINARY")"
          lipo -create \
            target/aarch64-apple-darwin/release/bahamut-launcher-shell \
            target/x86_64-apple-darwin/release/bahamut-launcher-shell \
            -output "$LAUNCHER_BINARY"
          archs="$(lipo -archs "$LAUNCHER_BINARY")"
          echo "universal archs: $archs"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *)
                echo "universal binary is missing the $arch slice" >&2
                exit 1
                ;;
            esac
          done

      - name: Build Windows update helper
        if: runner.os == 'Windows'
        run: cargo build --release --locked --bin bahamut-update-helper

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = $env:ASSET_NAME
          $staging = Join-Path $env:RUNNER_TEMP "bahamut-release-staging-$env:GITHUB_RUN_ID"
          $dist = Join-Path $env:RUNNER_TEMP "bahamut-release-dist-$env:GITHUB_RUN_ID"
          ./scripts/windows_release_archive_manifest_and_cleanliness.ps1 `
            -LauncherBinary $env:LAUNCHER_BINARY `
            -ClientBuildDirectory out/client-release/Release `
            -HelperBinary target/release/bahamut-update-helper.exe `
            -StagingRoot $staging `
            -ArchivePath (Join-Path $dist "$name.zip")
          New-Item -ItemType Directory -Force $dist | Out-Null
          $hash = (Get-FileHash (Join-Path $dist "$name.zip") -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline (Join-Path $dist "$name.zip.sha256")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath (Join-Path $dist "$name.zip") -Destination dist
          Copy-Item -LiteralPath (Join-Path $dist "$name.zip.sha256") -Destination dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p dist
          ./scripts/package-linux-tarball.sh \
            --launcher "$LAUNCHER_BINARY" \
            --client-build out/client-mingw \
            --label "$ASSET_NAME" \
            --output dist
          check="$RUNNER_TEMP/linux-check"
          rm -rf "$check"
          mkdir -p "$check"
          tar -xzf "dist/$ASSET_NAME.tar.gz" -C "$check"
          printed="$("$check/bahamut-launcher/bahamut-launcher" --version)"
          echo "launcher --version: $printed"
          if [[ -n "${BAHAMUT_RELEASE_TAG:-}" && "$printed" != "$BAHAMUT_RELEASE_TAG" ]]; then
            echo "launcher reports $printed but the release tag is $BAHAMUT_RELEASE_TAG" >&2
            exit 1
          fi

      # Signing follows the secrets, not the tag, so a branch dispatch can
      # produce a signed dev build. Without both secrets the app is ad hoc signed.
      - name: Detect macOS signing secrets
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${CERT_P12:-}" && -n "${ASC_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets are absent; packaging an ad hoc signed app that Gatekeeper blocks on first launch."
          fi

      - name: Import Developer ID certificate
        id: importcert
        if: runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_PWD:-}" ]]; then
            echo "::error::MACOS_CERT_PWD is empty. security import cannot import a passwordless .p12; re-export the Developer ID certificate with an export password and set MACOS_CERT_PWD."
            exit 1
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          # The keychain lives only for this job, so its password is generated per run.
          keychain_pwd="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pwd" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PWD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pwd" "$keychain" >/dev/null
          # codesign searches the default keychain, so the search list alone is not enough.
          security default-keychain -s "$keychain"
          keychains=("$keychain")
          while IFS= read -r entry; do
            entry="$(printf '%s' "$entry" | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')"
            if [[ -n "$entry" && "$entry" != "$keychain" ]]; then
              keychains+=("$entry")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          # Select by SHA-1 so a name mismatch cannot hide the identity. No -v: it
          # drops an identity whose chain the runner cannot complete.
          identities="$(security find-identity -p codesigning "$keychain")"
          echo "$identities"
          identity="$(awk '/Developer ID Application/ { print $2; exit }' <<< "$identities")"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application signing identity after import; the .p12 must hold the certificate and its private key."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Signing identity (SHA-1): $identity"

      - name: Package the macOS app
        id: macapp
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_ENABLED: ${{ steps.macsign.outputs.enabled }}
          SIGN_IDENTITY: ${{ steps.importcert.outputs.identity }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/macos-app"
          app="$staging/Bahamut Launcher.app"
          package_args=(
            --launcher "$LAUNCHER_BINARY"
            --client-build out/client-mingw
            --destination "$staging"
          )
          if [[ "${SIGN_ENABLED:-false}" == true ]]; then
            if [[ -z "${SIGN_IDENTITY:-}" ]]; then
              echo "::error::Developer ID signing is enabled but no signing identity was imported."
              exit 1
            fi
            package_args+=(--sign "$SIGN_IDENTITY")
          fi
          ./scripts/package-macos-app.sh "${package_args[@]}"
          mkdir -p dist
          # --norsrc keeps AppleDouble (._) entries out of the archive.
          ditto -c -k --norsrc --keepParent "$app" "dist/$ASSET_NAME.zip"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        if: runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        shell: bash
        env:
          APP: ${{ steps.macapp.outputs.app }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc_key.p8"
          echo "$ASC_KEY" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          rc=0
          out="$(xcrun notarytool submit "dist/$ASSET_NAME.zip" "${auth[@]}" --wait 2>&1)" || rc=$?
          echo "$out"
          if [[ "$rc" != 0 ]] || ! grep -qi 'status: Accepted' <<< "$out"; then
            submission="$(awk -F': *' '/^[[:space:]]*id:/ { print $2; exit }' <<< "$out")"
            if [[ -n "$submission" ]]; then
              xcrun notarytool log "$submission" "${auth[@]}" || true
            fi
            echo "::error::Notarization of $ASSET_NAME.zip was not Accepted; see the log above."
            rm -f "$key"
            exit 1
          fi
          # The ticket is stapled into the bundle, so the submitted zip is rebuilt.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm -f "dist/$ASSET_NAME.zip"
          ditto -c -k --norsrc --keepParent "$APP" "dist/$ASSET_NAME.zip"
          spctl -a -vvv -t exec "$APP"
          rm -f "$key"

      - name: Check the macOS zip
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_ENABLED: ${{ steps.macsign.outputs.enabled }}
        run: |
          set -euo pipefail
          # The checker extracts a copy, so the gate covers the published bytes.
          check_args=(--zip "dist/$ASSET_NAME.zip")
          if [[ "${SIGN_ENABLED:-false}" == true ]]; then
            check_args+=(--signed)
          fi
          ./scripts/check-macos-app-zip.sh "${check_args[@]}"

      - name: Checksum the macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist && shasum -a 256 "$ASSET_NAME.zip" > "$ASSET_NAME.zip.sha256" )

      - name: Clean up the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc_key.p8"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

      - name: Upload the built commit
        uses: actions/upload-artifact@v4
        with:
          name: commit-${{ runner.os }}
          path: ${{ runner.temp }}/commit/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Download built commits
        uses: actions/download-artifact@v4
        with:
          pattern: commit-*
          path: build-commits

      - name: Validate archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          prefix="bahamut-launcher-${TAG}"
          expected=(
            "$prefix-windows-x86_64.zip"
            "$prefix-windows-x86_64.zip.sha256"
            "$prefix-linux-x86_64.tar.gz"
            "$prefix-linux-x86_64.tar.gz.sha256"
            "$prefix-macos-universal.zip"
            "$prefix-macos-universal.zip.sha256"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}" | sort); then
            echo "release artifact set does not contain exactly the expected six files" >&2
            exit 1
          fi

          for archive in \
            "$prefix-windows-x86_64.zip" \
            "$prefix-linux-x86_64.tar.gz" \
            "$prefix-macos-universal.zip"; do
            checksum="$(sha256sum "release-assets/$archive" | cut -d' ' -f1)"
            expected_line="$checksum  $archive"
            actual_line="$(<"release-assets/$archive.sha256")"
            if [[ "$actual_line" != "$expected_line" ]]; then
              echo "checksum sidecar mismatch: $archive" >&2
              exit 1
            fi
          done

      - name: Verify the tag resolves to the built commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')"; then
            echo "failed to resolve remote tag: $TAG" >&2
            exit 1
          fi
          resolved_type=''
          resolved_sha=''
          for ((depth = 0; depth < 8; depth++)); do
            IFS=$'\t' read -r resolved_type resolved_sha <<< "$tag_ref"
            case "$resolved_type" in
              commit)
                break
                ;;
              tag)
                if ! tag_ref="$(gh api "repos/$GH_REPO/git/tags/$resolved_sha" --jq '[.object.type, .object.sha] | @tsv')"; then
                  echo "failed to resolve annotated tag object: $resolved_sha" >&2
                  exit 1
                fi
                ;;
              *)
                echo "remote tag did not resolve to a commit or tag object" >&2
                exit 1
                ;;
            esac
          done
          if [[ "$resolved_type" != 'commit' ]]; then
            echo "remote tag $TAG did not resolve to a commit" >&2
            exit 1
          fi
          echo "tag $TAG resolves to commit $resolved_sha"
          for file in build-commits/*/*; do
            built="$(<"$file")"
            if [[ "$built" != "$resolved_sha" ]]; then
              echo "$file was built from $built, but tag $TAG resolves to $resolved_sha" >&2
              exit 1
            fi
          done

      - name: Attach assets to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          # release.yml normally created the notes-only release already. A
          # manually pushed tag creates it here; --verify-tag refuses to
          # fabricate a tag, and the trailing view tolerates a lost race.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "Bahamut Launcher $TAG" "${release_args[@]}" \
              || gh release view "$TAG" >/dev/null
          fi
          # --clobber replaces same-named assets so reruns are idempotent.
          gh release upload "$TAG" release-assets/* --clobber
          echo "Attached $(find release-assets -maxdepth 1 -type f | wc -l) files to release $TAG"

      # Re-detected here because matrix job outputs are not reliable per leg.
      - name: Detect macOS signing secrets
        id: releasesign
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${CERT_P12:-}" && -n "${ASC_KEY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the ad hoc macOS note in the release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGN_ENABLED: ${{ steps.releasesign.outputs.enabled }}
        run: |
          set -euo pipefail
          marker='<!-- bahamut-launcher-macos-ad-hoc-note -->'
          separator=$'\n\n---\n\n'"$marker"
          # Skip rather than clobber the generated notes when the body cannot be read.
          if ! body="$(gh release view "$TAG" --json body --jq .body 2>/dev/null)" || [[ -z "$body" ]]; then
            echo "::warning::Could not read a non-empty release body for $TAG; leaving the ad hoc macOS note as it is."
            exit 0
          fi
          if [[ "${SIGN_ENABLED:-false}" == true ]]; then
            # A signed rebuild of a tag first published ad hoc withdraws the note.
            if [[ "$body" == *"$separator"* ]]; then
              gh release edit "$TAG" --notes "${body%%"$separator"*}"
              echo "Removed the ad hoc macOS note from $TAG."
            elif [[ "$body" == *"$marker"* ]]; then
              echo "::warning::The ad hoc macOS note marker on $TAG is not in its expected position; edit the release body by hand."
            else
              echo "No ad hoc macOS note on $TAG."
            fi
          elif [[ "$body" == *"$marker"* ]]; then
            echo "The ad hoc macOS note is already on $TAG."
          else
            note="$separator"$'\n\n**macOS:** Bahamut Launcher.app in this release is ad hoc signed, not notarized, so macOS blocks its first launch. On macOS 15 and later the Control-click Open bypass no longer works: after the first blocked launch, open System Settings > Privacy & Security, click Open Anyway, and launch the app again.'
            gh release edit "$TAG" --notes "${body}${note}"
            echo "Appended the ad hoc macOS note to $TAG."
          fi

      - name: Announce the release on Discord
        # A tag push announces once; a manual rebuild must not re-announce an old tag.
        if: github.event_name == 'push'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          PROJECT: Bahamut Launcher
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK:-}" ]]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL secret is not set; skipping the Discord announcement."
            exit 0
          fi
          # jq --arg escapes every value, so the tag cannot break out of the payload.
          payload="$(jq -n \
            --arg project "$PROJECT" \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            '{
              username: ($project + " Releases"),
              embeds: [{
                title: ($project + " " + $tag),
                description: ("A new " + $project + " release is available: " + $tag + "."),
                url: $url,
                color: 3447003
              }]
            }')"
          # A notification failure must not fail the release; the assets are attached.
          if curl -fsS --connect-timeout 10 --max-time 30 -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$payload"; then
            echo "Announced $TAG to Discord."
          else
            echo "::warning::Discord announcement for $TAG failed (webhook unreachable or rejected)."
          fi
